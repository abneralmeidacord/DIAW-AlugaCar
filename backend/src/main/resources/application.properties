spring.application.name=alugacar
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=alugacar
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.sql.init.mode=${DB_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/migration/schema.sql
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.allow-first-contact=${APP_ALLOW_FIRST_CONTACT:true}
app.seed-demo=${APP_SEED_DEMO:false}
server.error.include-message=never
server.error.include-stacktrace=never
