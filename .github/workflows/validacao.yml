name: Validar AlugaCar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alugacar
          POSTGRES_PASSWORD: alugacar-ci-only
          POSTGRES_DB: alugacar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Testar com H2
        run: mvn -B -ntp test
      - name: Validar SQL e testar com PostgreSQL
        run: >-
          mvn -B -ntp verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/alugacar
          -Dspring.datasource.username=alugacar
          -Dspring.datasource.password=alugacar-ci-only
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.sql.init.mode=always
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
